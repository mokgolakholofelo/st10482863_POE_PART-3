        <a href="../index.html">Home</a> |

    <main>

        <section class="enquiry-section">

            <h2>Service Enquiry</h2>

            <p>
                Complete the form below and one of our consultants will contact you
                regarding your enquiry.
            </p>

            <form id="enquiryForm">

                <label for="name">Full Name</label>
                <input type="text" id="name" name="name">
                <span class="error" id="nameError"></span>

                <label for="enquiryEmail">Email Address</label>
                <input type="email" id="enquiryEmail" name="enquiryEmail">
                <span class="error" id="enquiryEmailError"></span>

                <label for="enquiryPhone">Phone Number</label>
                <input type="tel" id="enquiryPhone" name="enquiryPhone">
                <span class="error" id="enquiryPhoneError"></span>

                <label for="service">Select Service</label>

                <select id="service" name="service">
                    <option value="">-- Select a Service --</option>
                    <option>Website Development</option>
                    <option>Website Maintenance</option>
                    <option>Computer Repairs</option>
                    <option>Network Installation</option>
                    <option>Cloud Solutions</option>
                    <option>Cybersecurity</option>
                    <option>IT Consulting</option>
                    <option>Data Backup & Recovery</option>
                </select>

                <span class="error" id="serviceError"></span>

                <label for="budget">Estimated Budget (R)</label>
                <input type="number" id="budget" name="budget">
                <span class="error" id="budgetError"></span>

                <label for="contactMethod">Preferred Contact Method</label>

                <select id="contactMethod" name="contactMethod">
                    <option value="">-- Select Contact Method --</option>
                    <option>Email</option>
                    <option>Phone Call</option>
                    <option>WhatsApp</option>
                </select>

                <label for="details">Additional Information</label>

                <textarea
                    id="details"
                    name="details"
                    rows="6"
                    placeholder="Describe your project or enquiry..."
                ></textarea>

                <span class="error" id="detailsError"></span>

                <button type="submit">Submit Enquiry</button>

                <p id="successMessage" class="success"></p>

            </form>

        </section>

    </main>
